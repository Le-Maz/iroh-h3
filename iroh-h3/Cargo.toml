[package]
name = "iroh-h3"
version = "0.3.0"
edition = "2024"
description = "HTTP/3 transport adapter bridging Iroh's QUIC P2P connections with the h3 HTTP/3 stack."
license = "MIT"
repository = "https://github.com/Le-Maz/iroh-h3"
readme = "../README.md"
keywords = ["quic", "p2p", "h3", "http3", "iroh"]
categories = ["network-programming", "asynchronous"]

[features]
datagram = ["dep:h3-datagram"]

[dependencies]
bytes = "1.10"
futures = "0.3.31"
h3 = "0.0.8"
h3-datagram = { version = "0.0.2", optional = true }
iroh = { workspace = true }
tokio-util = "0.7.17"

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "datagram"
required-features = ["datagram"]

[package]
name = "iroh-h3"
version = "0.4.0"
edition = "2024"
description = "HTTP/3 transport adapter bridging Iroh's QUIC P2P connections with the h3 HTTP/3 stack."
license = "MIT"
repository = "https://github.com/Le-Maz/iroh-h3"
readme = "../README.md"
keywords = ["quic", "p2p", "h3", "http3", "iroh"]
categories = ["network-programming", "asynchronous"]

[features]
datagram = ["dep:h3-datagram"]

[dependencies]
bytes.workspace = true
futures.workspace = true
h3.workspace = true
h3-datagram = { workspace = true, optional = true }
iroh.workspace = true
tokio-util.workspace = true

[dev-dependencies]
http.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "datagram"
required-features = ["datagram"]

[package]
name = "iroh-h3-axum"
version = "0.5.0"
edition = "2024"
description = "Axum integration for serving and consuming HTTP/3 over the Iroh QUIC P2P transport."
license = "MIT"
repository = "https://github.com/Le-Maz/iroh-h3"
readme = "../README.md"
keywords = ["axum", "quic", "http3", "p2p", "iroh"]
categories = ["network-programming", "asynchronous", "web-programming"]

[dependencies]
bytes.workspace = true
futures-lite.workspace = true
h3.workspace = true
http.workspace = true
iroh.workspace = true
iroh-h3.workspace = true
tokio = { workspace = true, features = ["rt"] }

axum = { workspace = true, default-features = false }
tower-service.workspace = true
http-body.workspace = true

# Use n0-futures to support both OS and WASM/web use
n0-future.workspace = true

[dev-dependencies]
iroh-h3-client.workspace = true
wasm-bindgen-test.workspace = true

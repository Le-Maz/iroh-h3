[package]
name = "iroh-h3-client"
version = "0.6.0"
edition = "2024"
description = "HTTP/3 client utilities over Iroh's QUIC P2P transport."
license = "MIT"
repository = "https://github.com/Le-Maz/iroh-h3"
readme = "./README.md"
keywords = ["quic", "p2p", "http3", "h3", "client"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes.workspace = true
futures.workspace = true
h3.workspace = true
iroh.workspace = true
iroh-h3.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["sync"] }

http-body.workspace = true
http-body-util.workspace = true
thiserror.workspace = true
dashmap.workspace = true
tracing.workspace = true
cookie.workspace = true

# Use n0-futures to support both OS and WASM/web use
n0-future.workspace = true

# JSON support
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
mockall.workspace = true

[dev-dependencies]
iroh-h3-axum = { path = "../iroh-h3-axum" }
axum = { workspace = true, features = ["json"], default-features = false }
wasm-bindgen-test.workspace = true

[features]
default = []
json = ["serde", "serde_json"]
